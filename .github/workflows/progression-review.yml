name: Progression review workspace
on:
  push:
    branches: [fix/progression-enemies-evolution-results-20260909]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:rules
      - run: pnpm run build
      - name: Collect offline test workspace
        run: tar -czf test-workspace.tar.gz node_modules dist
      - uses: actions/upload-artifact@v4
        with:
          name: progression-test-workspace
          path: test-workspace.tar.gz
          retention-days: 1
