name: Progression review workspace
on:
  push:
    branches: [fix/progression-enemies-evolution-results-20260909]
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: github.repository == 'chameleonjp-lab/sabasaba' && github.ref == 'refs/heads/fix/progression-enemies-evolution-results-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-verified source changes
        run: python .review/apply.py
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:rules
      - run: pnpm run build
      - name: Commit verified source to the isolated feature branch only
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/progression-enemies-evolution-results-20260909
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add client/src docs package.json scripts/verify-result-ui.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: restore weapon growth, enemy behaviors, evolution feedback and result actions'
            git push origin "HEAD:refs/heads/$branch"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify result layouts and sharing on built pages
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/sabasaba/ > /dev/null && break; sleep 1; done
          python scripts/verify-result-ui.py
      - name: Collect browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-ui-evidence
          path: artifacts/result-ui
          retention-days: 7
